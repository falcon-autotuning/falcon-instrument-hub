version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/falcon-autotuning/instrument-server/runtime/internal/issproto
plugins:
  - local: protoc-gen-go
    out: internal/issproto
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/issproto
    opt:
      - paths=source_relative
